# =============================================================================

# config/settings.yaml

# Supply Chain Control Tower — Public Demo Configuration

# =============================================================================

#

# This file contains public-safe default settings for the demo/community version.

#

# Do not commit real secrets, API keys, local machine paths, private settings,

# real customer data, or private project strategy.

#

# For local/private changes, create a separate ignored file such as:

# config/settings.local.yaml

# config/settings.private.yaml

#

# =============================================================================

# -----------------------------------------------------------------------------

# DATABASE

# -----------------------------------------------------------------------------

database:

# Public demo database path.

# Replace locally if you use a different database file.

path: "data/sample_supply_chain.db"

# Set to true after running the index setup script.

indexes_built: false

# Safety limit for query size.

max_rows_per_query: 10000

# -----------------------------------------------------------------------------

# PERFORMANCE

# -----------------------------------------------------------------------------

performance:
cache_enabled: true
cache_ttl_seconds: 300
cache_max_rows: 50000

token_tracking_enabled: true
token_log_path: "logs/token_usage.json"
token_alert_threshold: 2000
token_chars_per_token: 4

slow_query_threshold_ms: 500
perf_log_path: "logs/perf_log.json"
max_response_rows: 100

# -----------------------------------------------------------------------------

# SECURITY

# -----------------------------------------------------------------------------

security:
read_only_mode: true
max_input_length: 100
log_all_tool_calls: true
audit_log_path: "logs/audit.log"

block_write_operations: true
allowed_sql_operations:
- "SELECT"

max_calls_per_minute: 30
rate_limit_window_seconds: 60

# -----------------------------------------------------------------------------

# NOTIFICATIONS

# -----------------------------------------------------------------------------

notifications:
enabled: true

channels:
- "log"

anomaly_log_path: "logs/anomaly.log"

anomaly_thresholds:
critical_orders_pct: 20
unknown_rate_pct: 30
new_freight_holds: 2
inventory_stockouts: 1
rapid_tool_calls_per_minute: 10
token_spike_multiplier: 3
slow_tool_call_ms: 500

# -----------------------------------------------------------------------------

# COORDINATOR

# -----------------------------------------------------------------------------

coordinator:
enabled: true
agent_timeout_seconds: 10
max_agents_per_request: 5
health_check_on_startup: true
synthesis_mode: "summary"
coordinator_log_path: "logs/coordinator.log"

# -----------------------------------------------------------------------------

# TESTING

# -----------------------------------------------------------------------------

testing:
enabled: true

test_orders:
- "SO10001"
- "SO10002"
- "SO10003"

test_items:
- "ITEM-001"
- "ITEM-002"

test_warehouses:
- "WH-01"
- "WH-02"

report_path: "logs/test_results.json"
log_path: "logs/test_results.log"
fail_on_error: false
min_pass_rate_pct: 90

# -----------------------------------------------------------------------------

# LLM PROVIDERS

# -----------------------------------------------------------------------------

llm_providers:
primary:
name: "claude-desktop"
enabled: true

# Optional fallback support.

# Keep disabled in the public demo by default.

# If enabled locally, store API keys in environment variables only.

fallback:
name: "openrouter"
enabled: false
base_url: "https://openrouter.ai/api/v1"
model: "example-model-name"
api_key_env_var: "OPENROUTER_API_KEY"
max_tokens: 4096
temperature: 0.1

auto_fallback: false

# -----------------------------------------------------------------------------

# AGENTS

# -----------------------------------------------------------------------------

agents:
shipping_delay_agent: true
inventory_agent: true
po_agent: true
freight_agent: true
warehouse_agent: true
investigation_agent: true
recommendation_agent: true
ci_agent: true
memory_agent: true
performance_agent: true
coordinator_agent: true
test_agent: true

# -----------------------------------------------------------------------------

# LOGGING

# -----------------------------------------------------------------------------

logging:
level: "INFO"
console_output: true
rotate_logs: true
max_bytes: 1048576
backup_count: 5
